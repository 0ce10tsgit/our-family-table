<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Family Table</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #2b2b2b;
      background: #fcfcfa;
      line-height: 1.5;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 0.5rem;
      margin: 0;
      padding: 1rem;
      border-bottom: 1px solid #e5e5e5;
    }

    nav a {
      padding: 0.5rem 1rem;
      text-decoration: none;
      color: #333;
      border-radius: 6px;
    }

    nav a:hover {
      background: #f0efeb;
    }

    .recent-heading {
      padding: 0 1rem;
      margin: 0.5rem 0 0;
    }

    .cards {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;        /* Firefox: hide basic scrollbar */
    }

    .cards::-webkit-scrollbar {
      display: none;                /* Chrome/Safari: hide basic scrollbar */
    }

    /* Netflix-style paged carousel */
    .carousel {
      position: relative;
    }

    .carousel-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      border: 1px solid #ccc;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      font-size: 1.3rem;
      line-height: 1;
    }

    .carousel-nav.prev { left: 0.4rem; }
    .carousel-nav.next { right: 0.4rem; }

    .carousel-nav:disabled {
      opacity: 0;
      pointer-events: none;
    }

    .explore-heading {
      padding: 0 1rem;
      margin: 1.5rem 0 0;
    }

    .explore-section h3 {
      padding: 0 1rem;
      margin: 1rem 0 0;
    }

    .find-recipe {
      padding: 1rem;
    }

    .find-recipe h2 {
      margin: 0 0 0.5rem;
    }

    .search-bar {
      width: 100%;
      max-width: 400px;
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    .card {
      flex: 0 0 calc((100% - 2rem) / 3);  /* 3 cards fill the row width */
      aspect-ratio: 3 / 1;                /* short, wide cards */
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      background: #fff;
      scroll-snap-align: start;
    }

    .card:hover {
      border-color: #999;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    /* Filter category dropdowns */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .filter-category {
      position: relative;
    }

    .filter-toggle {
      padding: 0.4rem 0.9rem;
      border: 1px solid #ccc;
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      user-select: none;
      font-size: 0.9rem;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .filter-toggle:hover {
      border-color: #999;
    }

    .filter-category.open .filter-toggle,
    .filter-toggle.has-selection {
      background: #2b2b2b;
      border-color: #2b2b2b;
      color: #fff;
    }

    .filter-toggle .caret {
      margin-left: 0.35rem;
      font-size: 0.7rem;
    }

    .filter-menu {
      display: none;
      position: absolute;
      top: calc(100% + 0.35rem);
      left: 0;
      min-width: 170px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      padding: 0.4rem;
      z-index: 10;
    }

    .filter-category.open .filter-menu {
      display: block;
    }

    .filter-menu label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .filter-menu label:hover {
      background: #f0efeb;
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Recipes</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contribute</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <p class="recent-heading">Recent Additions</p>

  <div class="cards">
    <a href="#" class="card">Card 1</a>
    <a href="#" class="card">Card 2</a>
    <a href="#" class="card">Card 3</a>
  </div>

  <div class="find-recipe">
    <h2>Find a Recipe</h2>
    <input type="search" class="search-bar" placeholder="Search recipes...">

    <div class="filters" id="filters"></div>
  </div>

  <h2 class="explore-heading">Explore</h2>
  <div id="explore"></div>

  <script src="landingpage.js"></script>
</body>
</html>
