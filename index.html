<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .container {
            background-color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            border-radius: 30px;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background-color: white;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .back-btn {
            font-size: 20px;
            cursor: pointer;
        }
        
        .header-title {
            flex: 1;
            text-align: center;
            font-size: 16px;
        }
        
        .profile-icon {
            font-size: 20px;
        }
        
        .image-placeholder {
            width: 100%;
            height: 200px;
            background-color: white;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .category-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .category-btn {
            flex: 1;
            padding: 10px;
            background-color: #c0c0c0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .input-field {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
        }
        
        .text-area {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
            resize: vertical;
        }
        
        .ingredients-area {
            min-height: 100px;
        }
        
        .steps-area {
            min-height: 200px;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .action-btn {
            flex: 1;
            padding: 12px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .comments-section {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            min-height: 150px;
            text-align: center;
        }
        
        .comments-header {
            color: #666;
            font-size: 14px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <span class="back-btn">←</span>
            <div class="header-title">Recipe Name</div>
            <span class="profile-icon">👤</span>
        </div>
        
        <!-- Image Placeholder -->
        <div class="image-placeholder"></div>
        
        <!-- Category Buttons -->
        <div class="category-buttons">
            <button class="category-btn">Culture</button>
            <button class="category-btn">Family</button>
            <button class="category-btn">Type</button>
        </div>
        
        <!-- List Constraints -->
        <input type="text" class="input-field" placeholder="List Constraints:">
        
        <!-- Ingredients -->
        <textarea class="text-area ingredients-area" placeholder="Ingredients"></textarea>
        
        <!-- Steps -->
        <textarea class="text-area steps-area" placeholder="Steps"></textarea>
        
        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="action-btn">About the Author</button>
            <button class="action-btn">HeadedGetUrl(a)</button>
        </div>
        
        <!-- Comments Section -->
        <div class="comments-section">
            <div class="comments-header">COMMENTS</div>
        </div>
    </div>
</body>
</html>
